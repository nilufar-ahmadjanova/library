<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Elektron Kutubxona{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col text-base">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <span class="text-3xl">📚</span>
        <span class="font-extrabold text-2xl text-slate-900 tracking-tight">Kutubxona</span>
      </div>
      <div class="flex items-center space-x-6 text-base font-semibold text-slate-600">
        <a href="/" class="text-blue-600 hover:text-blue-700">Bosh sahifa</a>
        <a href="/admin/" class="hover:text-blue-600">Admin panel</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-white border-t border-slate-200 py-5 text-center text-sm text-slate-500">
    Elektron Kutubxona &copy; 2026. Barcha huquqlar himoyalangan.
  </footer>
</body>
</html>
