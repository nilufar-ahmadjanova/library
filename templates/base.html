<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Elektron Kutubxona{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; } .font-book { font-family: 'Lora', Georgia, serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/25 to-slate-100 text-slate-800 min-h-screen flex flex-col text-base selection:bg-blue-600 selection:text-white">
  <nav class="bg-white/85 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform">📚</div>
        <div>
          <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-900 bg-clip-text text-transparent">Kutubxona</span>
          <span class="hidden sm:inline-block ml-2 text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">Onlayn</span>
        </div>
      </a>
      <div class="flex items-center space-x-5 text-sm font-bold text-slate-600">
        <a href="/" class="text-blue-600 hover:text-blue-700 flex items-center gap-1"><span>🏠</span> Asosiy</a>
        <a href="/admin/" class="hover:text-blue-600 flex items-center gap-1"><span>⚙️</span> Boshqaruv</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-white/80 backdrop-blur-sm border-t border-slate-200/80 py-5 text-center text-xs text-slate-500">
    Elektron Kutubxona &copy; 2026. Barcha huquqlar himoyalangan.
  </footer>
</body>
</html>
