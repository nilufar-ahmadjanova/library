<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Elektron Kutubxona{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; } .font-book { font-family: 'Lora', Georgia, serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-purple-50/20 to-blue-50/30 text-slate-800 min-h-screen flex flex-col text-base selection:bg-purple-600 selection:text-white">
  <!-- Rang-barang yuqori chiziq (Rainbow line) -->
  <div class="h-1 bg-gradient-to-r from-pink-500 via-amber-400 via-emerald-400 via-cyan-400 to-indigo-600"></div>

  <nav class="bg-white/85 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 via-indigo-600 to-pink-500 flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-200 group-hover:scale-105 transition-transform">📚</div>
        <div>
          <span class="font-extrabold text-2xl tracking-tight bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-600 bg-clip-text text-transparent">Kutubxona</span>
          <span class="hidden sm:inline-block ml-2 text-[11px] font-black text-emerald-700 bg-emerald-100/80 px-2.5 py-0.5 rounded-full border border-emerald-300">23 ta kitob</span>
        </div>
      </a>
      <div class="flex items-center space-x-5 text-sm font-bold text-slate-700">
        <a href="/" class="text-indigo-600 hover:text-indigo-800 flex items-center gap-1.5 px-3 py-1.5 rounded-xl hover:bg-indigo-50 transition-colors"><span>🏠</span> Asosiy</a>
        <a href="/admin/" class="hover:text-purple-600 flex items-center gap-1.5 px-3 py-1.5 rounded-xl hover:bg-purple-50 transition-colors"><span>⚙️</span> Boshqaruv</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">{% block content %}{% endblock %}</main>

  <footer class="bg-white/80 backdrop-blur-sm border-t border-slate-200 py-5 text-center text-xs text-slate-500">
    Elektron Kutubxona &copy; 2026. Rang-barang zamonaviy mutolaa maskani.
  </footer>
</body>
</html>
